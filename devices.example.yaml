devices:
  - id: board-01
    label: Linux Board
    ssh:
      host: 192.168.110.151
      user: root
      key: /home/hyz/.ssh/id_rsa
      default_log_path: /tmp/sdcard/debug_log
    serial:
      port: /dev/ttyUSB0
      baud: 115200

  - id: board-02
    label: Bare Metal Target
    jlink:
      serial: "123456789"
      device: STM32H743
      interface: SWD
      speed_khz: 4000
      autoconnect: true

  - id: board-03
    label: Full Dev Board
    ssh:
      host: 192.168.1.102
      user: root
      key: $SSH_KEY_PATH
      default_log_path: /tmp/sdcard/debug_log
