image: rust:1.85.1

stages:
  - verify

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cargo/
    - target/

before_script:
  - apt-get update
  - apt-get install -y --no-install-recommends pkg-config libssl-dev libudev-dev
  - rustc --version
  - cargo --version

format:
  stage: verify
  script:
    - cargo fmt --all -- --check

test:
  stage: verify
  script:
    - cargo test --workspace
