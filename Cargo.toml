[workspace]
members = [
    "server",
    "shared",
    "adapters/ssh",
    "adapters/serial",
    "adapters/jlink",
    "adapters/adb",
    "frontend",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
uuid = { version = "1", features = ["js", "serde", "v4"] }
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
